<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#27140E"/>
      <stop offset="50%" stop-color="#18181C"/>
      <stop offset="100%" stop-color="#101012"/>
    </radialGradient>
    <radialGradient id="emberGlow" cx="50%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#FF5722" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#E64A19" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#BF360C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D84315"/>
      <stop offset="35%" stop-color="#F4511E"/>
      <stop offset="70%" stop-color="#FB8C00"/>
      <stop offset="100%" stop-color="#FFD54F"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0E0E0"/>
      <stop offset="50%" stop-color="#9E9E9E"/>
      <stop offset="100%" stop-color="#616161"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7043"/>
      <stop offset="50%" stop-color="#424242"/>
      <stop offset="100%" stop-color="#212121"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="url(#borderGrad)" stroke-width="6"/>

  <!-- Ember Ambient Light -->
  <circle cx="256" cy="310" r="190" fill="url(#emberGlow)"/>

  <!-- Barbecue Grill Circular Frame -->
  <circle cx="256" cy="270" r="165" fill="none" stroke="#2D2D32" stroke-width="8"/>
  <circle cx="256" cy="270" r="155" fill="#141417" stroke="#3A3A40" stroke-width="3"/>

  <!-- Grill Grates -->
  <path d="M120 270h272M140 220h232M140 320h232M175 175h162M175 365h162" stroke="#484850" stroke-width="5" stroke-linecap="round"/>

  <!-- Hot Coals (Brasas) -->
  <circle cx="200" cy="330" r="10" fill="#FF5722" filter="url(#glow)"/>
  <circle cx="270" cy="350" r="8" fill="#FF7043" filter="url(#glow)"/>
  <circle cx="310" cy="325" r="9" fill="#FF9800" filter="url(#glow)"/>
  <circle cx="240" cy="315" r="7" fill="#FFAB00" filter="url(#glow)"/>

  <!-- Crossed Skewers / Garfo de Churrasco -->
  <g stroke="url(#metalGrad)" stroke-width="8" stroke-linecap="round">
    <line x1="140" y1="380" x2="372" y2="148"/>
    <line x1="372" y1="380" x2="140" y2="148"/>
  </g>

  <!-- Flame Core (Chama Flamejante) -->
  <path d="M256 120 C230 170, 200 200, 200 250 C200 290, 225 320, 256 320 C287 320, 312 290, 312 250 C312 215, 290 180, 280 165 C275 190, 255 205, 255 205 C255 205, 275 160, 256 120 Z" 
        fill="url(#flameGrad)" filter="url(#glow)"/>

  <!-- Inner Vibrant Flame (Chama Interna Dourada) -->
  <path d="M256 195 C242 225, 230 245, 230 270 C230 292, 242 308, 256 308 C270 308, 282 292, 282 270 C282 250, 270 230, 256 195 Z" 
        fill="#FFF176"/>

  <!-- Sparkling Embers (Faíscas) -->
  <circle cx="185" cy="190" r="4" fill="#FFD54F" filter="url(#glow)"/>
  <circle cx="325" cy="180" r="3.5" fill="#FFB74D" filter="url(#glow)"/>
  <circle cx="230" cy="130" r="3" fill="#FFE082" filter="url(#glow)"/>
  <circle cx="295" cy="115" r="2.5" fill="#FFAB91" filter="url(#glow)"/>

  <!-- Bottom Badge: "CHURRASCO" Banner Subtitle -->
  <rect x="116" y="396" width="280" height="48" rx="24" fill="#1C1C22" stroke="#FF5722" stroke-width="2.5"/>
  <text x="256" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">
    CHURRASCO
  </text>
</svg>
